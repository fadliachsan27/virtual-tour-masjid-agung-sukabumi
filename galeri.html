<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeri - Masjid Agung Sukabumi</title>
  <link rel="icon" type="image/png" href="logo-MAKS-white.png" />
  <link rel="shortcut icon" type="image/png" href="logo-MAKS-white.png" />
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    body { padding-top: var(--navbar-h); }
    .section { padding-top: 60px; padding-bottom: 80px; }
    .galeri-group { margin-top: 30px; }
    .galeri-group:first-of-type { margin-top: 0; }
    .galeri-group-title {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      color: var(--gold);
      margin-bottom: 14px;
    }

    /* ===== GALERI GRID ===== */
    .galeri-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    @media (max-width: 768px) {
      .galeri-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }
    @media (max-width: 480px) {
      .galeri-grid { grid-template-columns: 1fr; gap: 10px; }
    }

    .galeri-item {
      aspect-ratio: 4/3; border-radius: 12px; overflow: hidden;
      background: var(--surface); border: 1px solid var(--border);
      cursor: pointer; position: relative;
    }
    .galeri-item img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.4s;
    }
    .galeri-item:hover img { transform: scale(1.06); }
    .galeri-item-num {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.5); color: rgba(255,255,255,0.7);
      font-size: 11px; padding: 3px 9px; border-radius: 6px;
      opacity: 0; transition: opacity 0.2s;
    }
    .galeri-item:hover .galeri-item-num { opacity: 1; }

    /* Empty state */
    .galeri-empty {
      grid-column: 1/-1; text-align: center; padding: 80px 20px;
      color: var(--text-muted);
    }
    .galeri-empty-icon { font-size: 56px; margin-bottom: 16px; }
    .galeri-empty-title { font-family: 'Playfair Display', serif; font-size: 20px; margin-bottom: 8px; color: var(--text); }
    .galeri-empty-sub { font-size: 14px; }

    /* Loading state */
    .galeri-loading {
      grid-column: 1/-1; text-align: center; padding: 60px 20px;
      color: var(--text-muted); font-size: 14px;
    }
    .loading-spinner {
      width: 36px; height: 36px; border: 3px solid var(--border);
      border-top-color: var(--gold); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; z-index: 9000;
      background: rgba(0,0,0,0.94); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .lightbox.active { opacity: 1; pointer-events: all; }
    .lightbox img {
      max-width: 90vw; max-height: 88vh; border-radius: 10px;
      object-fit: contain; box-shadow: 0 20px 80px rgba(0,0,0,0.5);
      transform: scale(0.93); transition: transform 0.3s;
    }
    .lightbox.active img { transform: scale(1); }
    .lightbox-close {
      position: absolute; top: 20px; right: 24px;
      font-size: 28px; color: rgba(255,255,255,0.7); cursor: pointer;
      line-height: 1; transition: color 0.2s; background: none; border: none;
    }
    .lightbox-close:hover { color: #fff; }
    .lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.1); border: none;
      color: #fff; font-size: 22px; padding: 14px 18px;
      border-radius: 10px; cursor: pointer; transition: background 0.2s;
    }
    .lightbox-nav:hover { background: rgba(255,255,255,0.2); }
    .lightbox-prev { left: 16px; }
    .lightbox-next { right: 16px; }
    .lightbox-counter {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.5); font-size: 13px;
    }

    /* ===== PRMA cards ===== */
    .galeri-item-prma { position: relative; }
    .galeri-prma-caption {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.15) 65%, transparent 100%);
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 12px;
    }
    .galeri-prma-caption-title {
      color: #fff; font-family: 'Playfair Display', serif; font-size: 14px;
      line-height: 1.3; margin-bottom: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .galeri-prma-caption-date {
      color: var(--gold); font-size: 11px; letter-spacing: 0.5px;
    }
    .galeri-prma-photocount {
      position: absolute; top: 10px; right: 10px;
      background: rgba(0,0,0,0.55); color: #fff;
      font-size: 11px; padding: 4px 9px; border-radius: 20px;
      display: flex; align-items: center; gap: 4px;
    }

    /* ===== PRMA Detail Modal ===== */
    .prma-detail {
      position: fixed; inset: 0; z-index: 9100;
      background: rgba(0,0,0,0.94); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
      padding: 20px;
    }
    .prma-detail.active { opacity: 1; pointer-events: all; }
    .prma-detail-box {
      display: flex; max-width: 1000px; width: 100%; max-height: 88vh;
      background: var(--surface, #161616); border: 1px solid var(--border, rgba(255,255,255,0.1));
      border-radius: 14px; overflow: hidden; transform: scale(0.95); transition: transform 0.3s;
      box-shadow: 0 20px 80px rgba(0,0,0,0.5);
    }
    .prma-detail.active .prma-detail-box { transform: scale(1); }
    .prma-detail-img-wrap {
      flex: 1.2; min-width: 0; background: #000;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .prma-detail-img-wrap img { width: 100%; height: 100%; object-fit: contain; max-height: 88vh; }

    /* Strip thumbnail untuk foto-foto dalam 1 kegiatan PRMA */
    .prma-sub-thumbs {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; padding: 6px; background: rgba(0,0,0,0.5);
      border-radius: 10px; max-width: 92%; overflow-x: auto; z-index: 2;
    }
    .prma-sub-thumb {
      width: 42px; height: 42px; border-radius: 6px; overflow: hidden;
      cursor: pointer; border: 2px solid transparent; flex-shrink: 0;
      opacity: 0.6; transition: opacity 0.2s, border-color 0.2s;
    }
    .prma-sub-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .prma-sub-thumb.active { opacity: 1; border-color: var(--gold); }

    .prma-sub-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,0.45); border: none; color: #fff; font-size: 16px;
      padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: background 0.2s; z-index: 2;
    }
    .prma-sub-nav:hover { background: rgba(0,0,0,0.65); }
    .prma-sub-prev { left: 10px; }
    .prma-sub-next { right: 10px; }
    .prma-detail-info {
      flex: 1; min-width: 280px; padding: 30px 28px; overflow-y: auto;
      display: flex; flex-direction: column; background: #14110c;
      color: rgba(255,255,255,0.85);
    }
    .prma-detail-date {
      color: var(--gold); font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 10px;
    }
    .prma-detail-title {
      font-family: 'Playfair Display', serif; font-size: 24px; color: #fff;
      margin-bottom: 16px; line-height: 1.35;
    }
    .prma-detail-desc {
      font-size: 14.5px; line-height: 1.8; color: rgba(255,255,255,0.7);
      white-space: pre-line; flex: 1;
    }
    .prma-detail-counter {
      margin-top: 18px; font-size: 12px; color: rgba(255,255,255,0.4);
    }
    .prma-detail-close {
      position: absolute; top: 20px; right: 24px;
      font-size: 28px; color: rgba(255,255,255,0.7); cursor: pointer;
      line-height: 1; transition: color 0.2s; background: none; border: none; z-index: 2;
    }
    .prma-detail-close:hover { color: #fff; }
    .prma-detail-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.1); border: none;
      color: #fff; font-size: 22px; padding: 14px 18px;
      border-radius: 10px; cursor: pointer; transition: background 0.2s; z-index: 2;
    }
    .prma-detail-nav:hover { background: rgba(255,255,255,0.2); }
    .prma-detail-prev { left: 16px; }
    .prma-detail-next { right: 16px; }
    @media (max-width: 760px) {
      .prma-detail-box { flex-direction: column; max-height: 92vh; overflow-y: auto; }
      .prma-detail-img-wrap img { max-height: 40vh; }
      .prma-detail-info { padding: 22px 20px; }
    }
        .nav-logo img,
    .footer-logo img,
    #audioOverlay img {
      transition: filter 0.3s;
      filter: brightness(0) invert(0);
      /* default: warna asli (tema terang) */
    }

    body.dark .nav-logo img,
    body.dark .footer-logo img,
    body.dark #audioOverlay img {
      filter: brightness(0) invert(1);
      /* tema gelap: jadi putih */
    }
  </style>
</head>
<body>
<nav class="navbar">
  <div class="nav-brand">
    <div class="nav-logo-prma">
        <img src="logo-prma.png" alt="Logo PRMA Kota Sukabumi" width="34" height="34"
          style="object-fit:contain; border-radius:50%;" />
      </div>
      <div class="nav-logo">
        <img src="logo-MAKS-transparent.png" alt="Logo Masjid Agung Kota Sukabumi" width="36" height="36"
          style="object-fit:contain;" />
      </div>
      <div>
        <div class="nav-title">Masjid Agung Kota Sukabumi</div>
        <div class="nav-subtitle">VIRTUAL TOUR</div>
      </div>
    </div>
  <div class="nav-links">
    <div class="nav-menu" id="navMenu">
      <a href="index.html" class="nav-link">Beranda</a>
      <a href="galeri.html" class="nav-link active">Galeri</a>
      <a href="virtual-tour.html" class="nav-link">Virtual Tour</a>
    </div>
    <button class="btn-theme" id="themeToggle" title="Ganti Tema">
      <span class="icon-light">🌙</span><span class="icon-dark">☀️</span>
    </button>
    <a href="admin/login.html" class="btn-admin-icon" title="Login Admin">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
    </a>
  </div>
</nav>

<section class="section">
  <div class="container">
    <div class="section-header">
      <div class="section-badge">GALERI FOTO</div>
      <h2 class="section-title">Keindahan Masjid Agung Sukabumi</h2>
    </div>

    <div id="galeriGroups">
      <div class="galeri-loading">
        <div class="loading-spinner"></div>
        Memuat foto galeri...
      </div>
    </div>
  </div>
</section>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <button class="lightbox-nav lightbox-prev" onclick="lightboxNav(-1)">&#8249;</button>
  <img id="lightboxImg" src="" alt=""/>
  <button class="lightbox-nav lightbox-next" onclick="lightboxNav(1)">&#8250;</button>
  <div class="lightbox-counter" id="lightboxCounter"></div>
</div>

<!-- PRMA Detail -->
<div class="prma-detail" id="prmaDetail">
  <button class="prma-detail-close" onclick="closePrmaDetail()">✕</button>
  <button class="prma-detail-nav prma-detail-prev" onclick="prmaDetailNav(-1)">&#8249;</button>
  <div class="prma-detail-box">
    <div class="prma-detail-img-wrap">
      <button class="prma-sub-nav prma-sub-prev" id="prmaSubPrev" onclick="prmaSubNav(-1)" style="display:none">&#8249;</button>
      <img id="prmaDetailImg" src="" alt=""/>
      <button class="prma-sub-nav prma-sub-next" id="prmaSubNext" onclick="prmaSubNav(1)" style="display:none">&#8250;</button>
      <div class="prma-sub-thumbs" id="prmaSubThumbs" style="display:none"></div>
    </div>
    <div class="prma-detail-info">
      <div class="prma-detail-date" id="prmaDetailDate"></div>
      <div class="prma-detail-title" id="prmaDetailTitle"></div>
      <div class="prma-detail-desc" id="prmaDetailDesc"></div>
      <div class="prma-detail-counter" id="prmaDetailCounter"></div>
    </div>
  </div>
  <button class="prma-detail-nav prma-detail-next" onclick="prmaDetailNav(1)">&#8250;</button>
</div>

<footer class="footer"><p>© 2025 Masjid Agung Sukabumi Virtual Tour</p></footer>

<script type="module" src="js/galeri.js"></script>
</body>
</html>
